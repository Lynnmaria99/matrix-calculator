[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-calculator"
version = "1.2.0"
description = "面向线性代数学习的矩阵计算器，包含命令行界面和可复用的 NumPy 计算核心"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
]
notebook = [
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6",
    "nbformat>=5",
    "nbclient>=0.8",
]
web = [
    "streamlit>=1.57",
]
desktop = [
    # PySide6/shiboken6 6.12.0 在 Linux + Python 3.11 offscreen 下会因 GC
    # 回收 shiboken 托管对象而 SIGSEGV（详见 tests/desktop_ui_tests.py 与
    # desktop/app.py 的预加载说明）；6.12 后续版本验证通过前先锁定 6.11.x。
    "PySide6>=6.6,<6.12",
    "matplotlib>=3.7",
]

[project.scripts]
matrix-calculator = "matrix_calculator.cli:main"
matrix-calculator-desktop = "matrix_calculator.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
