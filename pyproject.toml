[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-calculator"
version = "1.2.0"
description = "面向线性代数学习的矩阵计算器，包含命令行界面和可复用的 NumPy 计算核心"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
]
notebook = [
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6",
    "nbformat>=5",
    "nbclient>=0.8",
]
web = [
    "streamlit>=1.57",
]
desktop = [
    "PySide6>=6.6",
    "matplotlib>=3.7",
]

[project.scripts]
matrix-calculator = "matrix_calculator.cli:main"
matrix-calculator-desktop = "matrix_calculator.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
